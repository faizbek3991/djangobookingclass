{% extends "base.html" %}
{% block title %}Reschedule Booking{% endblock %}
{% block content %}
<h2 class="mb-4">Reschedule booking</h2>
<p class="text-muted">Currently booked: {{ object.session }}</p>
<form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'bookings:booking_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
