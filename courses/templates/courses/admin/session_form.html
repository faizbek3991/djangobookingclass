{% extends "base.html" %}
{% block title %}{% if object %}Edit Session{% else %}Add Session{% endif %}{% endblock %}
{% block content %}
<h2 class="mb-4">{% if object %}Edit session{% else %}Add session{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'courses:admin_session_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
